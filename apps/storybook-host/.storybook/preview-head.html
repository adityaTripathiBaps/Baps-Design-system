<!--
  Stamps the selected brand onto <html> BEFORE any story JS runs.

  Why this file exists: the brand scope class is toggled in preview.ts's
  `withDesignSystem` decorator, which is early enough for Angular but not early
  enough for CSS. The preview iframe paints its first frame from the stylesheets
  alone, and until the decorator runs there is no `.baps-ds-sampark` anywhere —
  so a Sampark selection showed one frame of MyBKY surfaces before flipping.
  That is the "it loads the other theme first" report.

  The manager already solves the same problem for its own chrome by reading the
  global out of the URL at module load (see `brandFromUrl` in manager.tsx). This
  is that trick for the preview: the iframe URL carries the same `globals`
  param, so the brand is knowable before a single component exists.

  ON <html>, NOT <body>: at head-parse time there is no body yet. Every rule in
  the design system uses this class as an ANCESTOR (`:is(.baps-ds-sampark, …)
  .p-treeselect`), and <html> is an ancestor of everything, so the scope
  resolves identically. The decorator still toggles the class on <body> for live
  toolbar switches; having it on both elements is inert, since neither selector
  cares which ancestor carries it.

  Deliberately inline and dependency-free — it has to run before the bundle.
-->
<script>
  (function () {
    try {
      var g = new URLSearchParams(window.location.search).get('globals') || '';
      if (/(?:^|;)designSystem:sampark(?:;|$)/.test(g)) {
        document.documentElement.classList.add('baps-ds-sampark');
      }
    } catch (e) {
      /* No brand class is the MyBKY default, which is the correct fallback. */
    }
  })();
</script>

<!--
  One brand at a time on DOCS pages.

  The sidebar filter (manager.tsx) cannot reach a docs page: MDX mounts every
  `<Canvas of={…}>` it names regardless of the selected brand, and the prose
  around it mounts too. So a MyBKY page kept showing a Sampark example AND the
  paragraph describing it.

  `<BrandOnly brand="…">` (see .storybook/blocks) wraps a brand's prose and its
  canvas in one `[data-brand]` element; these rules decide which survives.

  SCOPED TO `.sbdocs-wrapper`, AND THAT SCOPE IS THE WHOLE SAFETY ARGUMENT.
  Measured before writing this: in story mode `.sbdocs-wrapper`, `.sbdocs` and
  `.docs-story` all return 0 elements, and in docs mode they return 1, 6 and 4.
  So nothing here can match inside a story iframe, which is what the 536 visual
  baselines screenshot. (`#storybook-docs` would NOT have been safe — it is
  present in both modes.)

  The brand class is read as an ANCESTOR so it matches whether it sits on
  <html> (stamped from the URL before first paint) or <body> (toggled live by
  the decorator on a toolbar switch).
-->
<style>
  /* MyBKY is the unscoped default: hide the Sampark-only blocks. */
  .sbdocs-wrapper [data-brand='sampark'] { display: none; }

  /* Sampark page: the mirror image. */
  .baps-ds-sampark .sbdocs-wrapper [data-brand='sampark'] { display: block; }
  .baps-ds-sampark .sbdocs-wrapper [data-brand='mybky'] { display: none; }

  /* Blocks that show both brands at once stay hidden until the toolbar's
     "Show brand comparisons" toggle is on — the same rule the sidebar applies
     to `ds:comparison` stories, so the two surfaces agree. */
  .sbdocs-wrapper [data-brand='comparison'] { display: none; }
  body[data-baps-comparison='on'] .sbdocs-wrapper [data-brand='comparison'] { display: block; }
</style>
